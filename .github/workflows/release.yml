name: Release Android artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate VirusTotal credentials
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [[ -z "$VIRUSTOTAL_API_KEY" ]]; then
            echo "Configure the VIRUSTOTAL_API_KEY repository secret" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager is unavailable at $sdkmanager" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          gomobile init

      - name: Validate release tag
        run: |
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -n 1)"
          expected_tag="v${version_name}"
          if [[ -z "$version_name" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $expected_tag" >&2
            exit 1
          fi

      - name: Restore Android signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "Android signing secrets are not configured" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/megaproxy-release.p12"
          password_file="$RUNNER_TEMP/megaproxy-keystore-password"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          printf '%s' "$KEYSTORE_PASSWORD" > "$password_file"
          chmod 600 "$keystore" "$password_file"
          echo "MEGAPROXY_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "MEGAPROXY_KEY_PASSWORD_FILE=$password_file" >> "$GITHUB_ENV"

      - name: Build and verify signed release artifacts
        env:
          MEGAPROXY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEGAPROXY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MEGAPROXY_GIT_COMMIT: ${{ github.sha }}
        run: bundle exec fastlane android release_artifacts

      - name: Scan signed APKs with VirusTotal
        timeout-minutes: 60
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: bundle exec fastlane android release_virustotal

      - name: Preserve VirusTotal report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-report
          path: dist/release/VIRUSTOTAL.md
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/release/*.apk dist/release/SHA256SUMS dist/release/VIRUSTOTAL.md)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/release-notes.md"
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes"
            python3 - "$notes" dist/release/VIRUSTOTAL.md <<'PY'
          import pathlib
          import sys
          notes, report = map(pathlib.Path, sys.argv[1:])
          body = notes.read_text()
          start = "<!-- megaproxy-virustotal -->"
          end = "<!-- /megaproxy-virustotal -->"
          if start in body:
              before, rest = body.split(start, 1)
              _, after = rest.split(end, 1)
              body = before.rstrip() + after
          notes.write_text(body.rstrip() + "\n\n" + start + "\n" + report.read_text() + end + "\n")
          PY
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            version_code_base="$(sed -nE 's/^val versionCodeBase = ([0-9]+)/\1/p' app/build.gradle.kts)"
            code="$((version_code_base * 1000))"
            notes="$RUNNER_TEMP/release-notes.md"
            en="fastlane/metadata/android/en-US/changelogs/$code.txt"
            ru="fastlane/metadata/android/ru-RU/changelogs/$code.txt"
            if [[ ! -s "$en" || ! -s "$ru" ]]; then
              echo 'Both EN/RU release changelogs are required' >&2
              exit 1
            fi
            { printf '## English\n\n'; cat "$en"; printf '\n## Русский\n\n'; cat "$ru"; } > "$notes"
            { printf '\n<!-- megaproxy-virustotal -->\n'; cat dist/release/VIRUSTOTAL.md; printf '<!-- /megaproxy-virustotal -->\n'; } >> "$notes"
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file "$notes" \
              --title "MegaProxy ${GITHUB_REF_NAME}"
          fi
