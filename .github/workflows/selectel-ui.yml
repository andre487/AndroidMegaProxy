name: Selectel UI
run-name: Selectel UI · ${{ inputs.devices }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      devices:
        description: Required smoke test or additional Android versions
        type: choice
        options: [required, additional]
        default: required
        required: true

permissions:
  contents: read

# Manual runs on the same branch wait for cleanup instead of cancelling a paid session.
concurrency:
  group: selectel-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  status:
    name: Publish UI start
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v8
        env:
          PROFILE: ${{ inputs.devices }}
        with:
          script: |
            const profile = process.env.PROFILE;
            if (!['required', 'additional'].includes(profile)) throw new Error('Invalid UI profile');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, context: `Selectel UI ${profile}`,
              state: 'pending', description: 'Building APKs and running device tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  changes:
    name: Check Android change scope
    needs: status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the PR comparison base
        id: base
        uses: actions/github-script@v8
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}`, per_page: 100
            });
            const pr = prs.find(pr => pr.head.sha === context.sha && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`);
            // Without a matching PR, run conservatively instead of guessing the diff.
            core.setOutput('sha', pr ? pr.base.sha : '0'.repeat(40));
      - name: Classify the full PR diff before renting
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  build:
    needs: [status, changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FASTLANE_SKIP_DOCS: "1"
      DEVICE_PROFILE: ${{ inputs.devices }}
    outputs:
      devices: ${{ steps.matrix.outputs.devices }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Read fixed device matrix
        id: matrix
        run: echo "devices=$(python3 scripts/selectel_ui.py matrix --profile "$DEVICE_PROFILE")" >> "$GITHUB_OUTPUT"
      - name: Build application and UI test APKs before renting
        run: bundle exec fastlane android ui_test_artifacts profile:"$DEVICE_PROFILE"
      - uses: actions/upload-artifact@v7
        id: apks
        with:
          name: selectel-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Publish APK link
        env:
          APK_URL: ${{ steps.apks.outputs.artifact-url }}
        run: echo "[Debug application and UI test APKs]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"

  ui-tests:
    needs: build
    if: needs.build.result == 'success'
    name: UI · ${{ matrix.model }} · API ${{ matrix.api }} · ${{ matrix.abi }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build.outputs.devices) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FASTLANE_SKIP_DOCS: "1"
      SELECTEL_DEVICE_MODEL: ${{ matrix.model }}
      SELECTEL_DEVICE_MANUFACTURER: ${{ matrix.manufacturer }}
      SELECTEL_ANDROID_API: ${{ matrix.api }}
      SELECTEL_DEVICE_ABI: ${{ matrix.abi }}
      SELECTEL_RESULT_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - name: Add ADB to PATH
        run: echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: selectel-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk
      - name: Acquire Selectel device
        env:
          SELECTEL_USERNAME: ${{ secrets.SELECTEL_USERNAME }}
          SELECTEL_PASSWORD: ${{ secrets.SELECTEL_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
        run: bundle exec fastlane android selectel_acquire
      - name: Persist lease journal for recovery (no credentials)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selectel-lease-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: .selectel/lease.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Run device UI tests
        run: bundle exec fastlane android selectel_run
      - name: Release paid device lease
        if: always()
        env:
          SELECTEL_USERNAME: ${{ secrets.SELECTEL_USERNAME }}
          SELECTEL_PASSWORD: ${{ secrets.SELECTEL_PASSWORD }}
          SELECTEL_ACCOUNT_ID: ${{ secrets.SELECTEL_ACCOUNT_ID }}
          SELECTEL_PROJECT_ID: ${{ secrets.SELECTEL_PROJECT_ID }}
        run: bundle exec fastlane android selectel_release
      - name: Upload UI reports
        if: always()
        id: reports
        uses: actions/upload-artifact@v7
        with:
          name: selectel-ui-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: app/build/reports/selectel/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish report link
        if: always()
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          if [[ -n "$REPORT_URL" ]]; then
            echo "[Selectel UI reports and screenshots]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

  result:
    # Commit statuses are the PR-facing contexts; avoid an identically named check run.
    name: UI result · ${{ inputs.devices }}
    if: always()
    needs: [changes, build, ui-tests]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish the UI result on the tested commit
        uses: actions/github-script@v8
        env:
          PROFILE: ${{ inputs.devices }}
          SCOPE_RESULT: ${{ needs.changes.result }}
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
          BUILD_RESULT: ${{ needs.build.result }}
          UI_RESULT: ${{ needs.ui-tests.result }}
        with:
          script: |
            const profile = process.env.PROFILE;
            if (!['required', 'additional'].includes(profile)) throw new Error('Invalid UI profile');
            const skipped = process.env.SCOPE_RESULT === 'success' && process.env.ANDROID_CHANGED === 'false';
            const passed = skipped || (process.env.BUILD_RESULT === 'success' && process.env.UI_RESULT === 'success');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, context: `Selectel UI ${profile}`,
              state: passed ? 'success' : 'failure',
              description: skipped ? 'UI not required: no Android-impacting changes' : passed ? 'All selected UI tests and cleanup passed' : 'UI run failed, was cancelled, or cleanup failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!passed) core.setFailed('UI build, device tests, or cleanup did not succeed');
