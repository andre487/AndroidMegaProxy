name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Run native tests with the race detector
        run: bundle exec fastlane android native_tests

  android-tests:
    name: Android tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "sdkmanager is unavailable at $sdkmanager" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Run Android checks and verify the unsigned APK
        run: bundle exec fastlane android android_checks

      - name: Publish PR debug APK
        if: github.event_name == 'pull_request'
        id: debug_apk_upload
        uses: actions/upload-artifact@v7
        with:
          name: megaproxy-pr-${{ github.event.pull_request.number }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish PR unsigned release APK
        if: github.event_name == 'pull_request'
        id: unsigned_release_apk_upload
        uses: actions/upload-artifact@v7
        with:
          name: megaproxy-pr-${{ github.event.pull_request.number }}-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add APK download links to the job summary
        if: github.event_name == 'pull_request'
        env:
          DEBUG_APK_URL: ${{ steps.debug_apk_upload.outputs.artifact-url }}
          UNSIGNED_RELEASE_APK_URL: ${{ steps.unsigned_release_apk_upload.outputs.artifact-url }}
        run: |
          {
            echo "## APK artifacts"
            echo
            echo "- [Download debug APK]($DEBUG_APK_URL) — signed with the disposable Android debug key"
            echo "- [Download unsigned release APK]($UNSIGNED_RELEASE_APK_URL) — verified unsigned"
            echo
            echo "Artifacts expire after 14 days. Neither APK uses the MegaProxy release key."
          } >> "$GITHUB_STEP_SUMMARY"

  android-ui-tests:
    name: Android UI tests
    # GitHub's Linux runner does not currently expose /dev/kvm consistently;
    # without acceleration the API 35 x86_64 emulator can crash before instrumentation starts.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Install native build dependencies
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Run Compose UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bundle exec fastlane android ui_tests

      - name: Publish UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-report
          path: |
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: ignore
          retention-days: 14
