name: JUnit reports

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: false
        default: "/^junit-(.+)$/"
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  reports:
    name: Test results
    # Internal PRs and pushes call this workflow from CI. Fork PRs need a trusted
    # workflow_run context because their CI token cannot write GitHub Checks.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Parse uploaded data only; never check out or run code from the tested PR.
      # Inline trusted code also works for fork reports without checking out PR code.
      - name: Retry transient GitHub Check updates
        run: |
          cat > "$RUNNER_TEMP/test-report-check-retry.cjs" <<'JS'
          const {setTimeout: sleep} = require('node:timers/promises');
          const fetch = globalThis.fetch;
          const api = new URL(process.env.GITHUB_API_URL);
          globalThis.fetch = async (input, options) => {
            const url = new URL(input instanceof Request ? input.url : input);
            // Octokit sends JSON strings; do not replay streams or Check creation.
            if (url.origin !== api.origin || options?.method !== 'PATCH' ||
                typeof options.body !== 'string' ||
                !/^\/repos\/[^/]+\/[^/]+\/check-runs\/\d+$/.test(url.pathname)) {
              return fetch(input, options);
            }
            const delays = [1000, 3000];
            for (let attempt = 0; ; attempt++) {
              const response = await fetch(input, options);
              if (response.status !== 404 || attempt === delays.length) return response;
              await response.body?.cancel();
              console.warn(`GitHub Check update returned 404; retry ${attempt + 1}/2 in ${delays[attempt]}ms`);
              await sleep(delays[attempt], undefined, {signal: options.signal});
            }
          };
          JS
      - name: Publish JUnit results in GitHub Checks
        env:
          NODE_OPTIONS: --require=${{ runner.temp }}/test-report-check-retry.cjs
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          artifact: ${{ inputs.artifact || '/^junit-(.+)$/' }}
          name: 'Test results · $1'
          path: '**/*.xml'
          reporter: java-junit
          list-tests: all
          max-annotations: 10
          fail-on-empty: false
          use-actions-summary: false
      - name: Add collapsible test groups to Actions Summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          artifact: ${{ inputs.artifact || '/^junit-(.+)$/' }}
          name: 'Test results · $1'
          path: '**/*.xml'
          reporter: java-junit
          list-tests: all
          max-annotations: 10
          fail-on-empty: false
          use-actions-summary: true
          collapsed: always
