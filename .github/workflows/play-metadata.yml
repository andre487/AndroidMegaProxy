name: Upload Google Play store listing

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag whose descriptions and artwork match the production release (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-store-text
  cancel-in-progress: false

jobs:
  upload:
    name: Prepare store listing for review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow code and release tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Upload descriptions and artwork from the selected tag
        env:
          PLAY_METADATA_RELEASE_TAG: ${{ inputs.release_tag }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
        run: bundle exec fastlane android play_metadata

      - name: Summarize next step
        run: |
          echo 'Store descriptions and artwork uploaded. Check Publishing overview in Play Console and send it for review with the matching production release. Nothing was submitted for review by this workflow.' >> "$GITHUB_STEP_SUMMARY"
